[project]
name = "chainreaction-backend"
version = "0.1.0"
description = "FastAPI backend for the Chain Reaction multiplayer game"
authors = [{ name = "Chain Reaction Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13.1",
    "redis[hiredis]>=5.0.4",
    "aioredis>=2.0.1",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "azure-storage-blob>=12.19.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.3",
    "msgpack>=1.0.8",
    "pyinstrument>=4.6.2",
    "chainreaction-py @ git+https://github.com/AccXLR8/Python-Engine.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "fakeredis>=2.21.1",
    "ruff>=0.5.0"
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
